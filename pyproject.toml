[project]
name = "mtga-mcp"
version = "0.1.0"
description = "Local MCP server for querying your Magic: The Gathering Arena collection"
readme = "README.md"
authors = [
    { name = "Scott", email = "scott@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.0.0",
]

[project.scripts]
mtga-mcp = "mtga_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
